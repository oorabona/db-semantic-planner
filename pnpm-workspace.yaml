packages:
  - "packages/*"
  - "tests/e2e"
  - "tests/matrix"
# strict: `pnpm add` refuses a version outside the catalog instead of writing a
# literal range into the manifest. It governs that path only — a hand-edited
# manifest still needs scripts/check-catalog.mjs, which CI runs.
catalogMode: strict
# Which dependency build scripts may run. A name absent from this map is
# undecided, and pnpm reports it on every install until someone decides.
#
# The refusal is deliberate, not an oversight:
#   simple-git-hooks  its postinstall writes .git/hooks. The root `prepare`
#                     script already runs the same tool explicitly, so the
#                     postinstall is redundant — and it follows symlinks, so on
#                     a checkout whose hooks are symlinked out of the repository
#                     it overwrites the link target instead of the hook.
#
# The four `true` entries are the build scripts this workspace runs: esbuild
# validates its platform binary, cpu-features and ssh2 compile the native
# crypto testcontainers can use, protobufjs generates its bundle.
allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  simple-git-hooks: false
  ssh2: true

# Security floors on transitive dependencies. Each names the advisory-fixed
# version; a resolution already above the floor is left alone.
overrides:
  'lodash@>=4.0.0 <4.17.23': '>=4.17.23'
  dompurify: '>=3.3.2'
  'ws@>=8.0.0 <8.20.1': '>=8.20.1'

