# cliff.toml — db-semantic-planner CHANGELOG config
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
{% if commit.breaking %}[**BREAKING**] {% endif %}\
{%- set first_line = commit.message | split(pat="\\n") | first | trim -%}
{%- set stripped = first_line | split(pat=": ") | slice(start=1) | join(sep=": ") -%}
{%- if stripped %}{{ stripped | upper_first }}{% else %}{{ first_line | upper_first }}{% endif %}
{% endfor %}
{% endfor %}
"""

footer = """

<!-- generated by git-cliff -->
"""

trim = true
render_always = true

postprocessors = [
    { pattern = '\s+$', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

commit_preprocessors = [
    # Extract (#NN) PR references inline — already in subject, kept as-is
]

protect_breaking_commits = true

commit_parsers = [
    # Skip pure noise
    { message = "^chore\\(deps", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: finalize session", skip = true },
    { message = "^docs\\(todo\\)", skip = true },
    { message = "^chore: bump", skip = true },
    { message = "^chore: update lock", skip = true },

    # Group in order
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->Refactors" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^ci", group = "<!-- 6 -->CI/CD" },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },

    # Anything else — catch-all
    { message = ".*", group = "<!-- 9 -->Other" },
]

filter_commits = false
fail_on_unmatched_commit = false

link_parsers = [
    { pattern = "\\(#(\\d+)\\)", href = "https://github.com/oorabona/db-semantic-planner/pull/$1" },
]

use_branch_tags = false
topo_order = false
topo_order_commits = false
sort_commits = "oldest"
recurse_submodules = false
