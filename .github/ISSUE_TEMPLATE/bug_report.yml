name: Bug report
description: Report a defect in db-semantic-planner
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out every section — incomplete reports may be closed.
  - type: input
    id: version
    attributes:
      label: "@dbsp/core version"
      description: "Run `pnpm list @dbsp/core` and paste the version."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: "Node.js version"
      description: "Output of `node --version`."
      placeholder: "20.x"
    validations:
      required: true
  - type: input
    id: postgres-version
    attributes:
      label: "PostgreSQL version"
      description: "Server version. Use `N/A` if compile-only mode."
      placeholder: "18"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal reproduction"
      description: "Smallest code snippet that reproduces the bug. Use a fenced code block."
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "Include the error message and stack trace if any."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Linked PR, related issue, environment details."
    validations:
      required: false
