name: Doctest (real DB)

# Runs the doctest suite against a real PostgreSQL container (the `// doctest:
# real-db-only` blocks). `test-docs-real-db` is a required check on `main`, so
# it runs on every pull request: a path filter would leave PRs outside it
# blocked with no way to report the check. Also runs on pushes to main,
# workflow_dispatch and a nightly cron.
#
# Compile-only doctests still run unconditionally as the `Verify documentation
# examples` step inside the `test` job in ci.yml. This workflow only governs
# the slower real-DB variant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 03:17 UTC every night — slightly off-the-hour to avoid GHA contention.
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  test-docs-real-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/oorabona/postgres:18-alpine-full
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Split per-package builds so workflow logs surface which package failed
      # individually (matches the ci.yml `test` job style).
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - run: pnpm test:docs
        env:
          DBSP_DOCTEST_REAL_DB: '1'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/doctest
