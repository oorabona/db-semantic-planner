name: Catalogue PostgreSQL matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/adapter-pgsql/**'
      - 'packages/core/**'
      - 'packages/nql/**'
      - 'packages/types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tests/matrix/**'
      - '.github/workflows/catalogue-matrix.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  catalogue-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['10', '11', '14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: dbsp
          POSTGRES_PASSWORD: dbsp
          POSTGRES_DB: dbsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbsp -d dbsp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - run: pnpm -r typecheck
      - run: pnpm vitest run --config tests/matrix/vitest.config.ts
        env:
          MATRIX_DATABASE_URL: postgres://dbsp:dbsp@localhost:5432/dbsp
