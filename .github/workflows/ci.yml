name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - run: pnpm biome check
      - run: pnpm typecheck
      - run: pnpm -C packages/core test
      - run: pnpm -C packages/adapter-pgsql test
      - run: pnpm -C packages/nql test
      - name: Verify documentation examples
        run: pnpm test:docs

  test-docs-real-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/oorabona/postgres:18-alpine-full
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build && pnpm -C packages/nql build && pnpm -C packages/core build && pnpm -C packages/adapter-pgsql build
      - run: pnpm test:docs
        env:
          DBSP_DOCTEST_REAL_DB: '1'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/doctest

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
