name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - run: pnpm biome check
      - run: pnpm typecheck
      - run: pnpm -C packages/core test
      - run: pnpm -C packages/adapter-pgsql test
      - run: pnpm -C packages/nql test
      - name: Verify documentation examples (compile-only)
        # Compile-only doctest path — fast, runs unconditionally.
        # The slower real-DB variant lives in .github/workflows/doctest-real-db.yml
        # behind a path filter for relevant changes only.
        run: pnpm test:docs

      - name: Check documentation links and API references
        # The doctests execute the code IN the docs. This checks everything around
        # it: a link that points at a page which no longer exists, and prose naming
        # an export the packages no longer have. Both survive a build and a deploy —
        # a deleted API left standing in a guide fails no test, because the guide
        # never calls it. It only teaches it.
        run: pnpm check:docs

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
