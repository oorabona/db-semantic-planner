name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The frozen install fails on a manifest that has drifted from the lockfile.
      # It does not see everything: a peer range shadowed by a dependency of the
      # same name never reaches the lockfile, which is why the check reads the
      # manifests directly rather than trusting the install. Keep both, in this
      # order — the install is what makes the lockfile describe the manifests, and
      # the check is what holds those manifests to the catalog.
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-catalog.mjs
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - run: pnpm biome check
      - run: pnpm typecheck
      # Workspace-wide, never a hand-written list of packages: this step used to
      # name core, adapter-pgsql and nql, so cli, gui, mcp-server and types were
      # never run here and could go red without CI noticing.
      - run: pnpm test:unit
      # `pnpm -r` runs the eight packages but not the root, where the guards under
      # scripts/ live. The glob is deliberate: a new guard's tests run here
      # without anyone remembering to add a line.
      - run: pnpm test:scripts
      - name: Verify documentation examples (compile-only)
        # Compile-only doctest path — fast, runs unconditionally.
        # The slower real-DB variant lives in .github/workflows/doctest-real-db.yml
        # behind a path filter for relevant changes only.
        run: pnpm test:docs

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gui/src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            patchelf
      - name: Check Rust dependencies
        working-directory: packages/gui/src-tauri
        run: cargo check --locked

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
