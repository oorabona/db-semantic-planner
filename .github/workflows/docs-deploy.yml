name: Deploy Docs

on:
  push:
    branches: [main]
  # Build on pull requests too. Without this the docs bundle is only ever built
  # AFTER a merge, so a change that breaks it lands on main and stays broken —
  # which is exactly what happened when the adapter began importing `node:crypto`
  # for its savepoint names: red on main for thirteen hours, across two merges and
  # a release, invisible to every PR check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref so a PR build never queues behind (or cancels) the pages deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/types build
      - run: pnpm -C packages/nql build
      - run: pnpm -C packages/core build
      - run: pnpm -C packages/adapter-pgsql build

      - name: Build VitePress site
        env:
          # A pull request publishes nothing, so a placeholder origin is enough to
          # answer the only question it asks: does the site still build? On main the
          # real values must be set — the config refuses to build without them rather
          # than publish a site with a broken sitemap.
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:4173' || vars.SITE_URL }}
          SITE_BASE: ${{ github.event_name == 'pull_request' && '/' || vars.SITE_BASE }}
        run: pnpm -C packages/docs build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: packages/docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    # Granted here rather than at the top of the file: a pull-request build has no
    # business holding write access to Pages.
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
