name: Publish
# Triggered AFTER release-please completes (workflow_run), because the tags and
# GitHub Releases that release-please creates with GITHUB_TOKEN do NOT, by
# design, trigger other workflows (push/release events). workflow_run is the
# supported way to chain a workflow after a GITHUB_TOKEN-driven one.
# workflow_dispatch allows manual re-publishing / recovery.
#
# The file path is unchanged on purpose: npm OIDC trusted publishing is
# registered against this workflow file, so it must keep publishing.
on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Serialize publishes: never let two Publish runs (a workflow_run chained after
  # release-please AND a manual workflow_dispatch) race on the same npm PUT — that
  # yields "409 Conflict / Failed to save packument". Queue rather than cancel so
  # an in-flight publish always finishes; the per-version `npm view` guard makes
  # the queued run a no-op if everything is already up.
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Manual dispatch always runs; the chained run only when release-please succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # OIDC tokenless ("trusted") publishing requires npm >= 11.5.1; Node 22
      # ships npm 10.x, which can sign provenance but cannot authenticate the
      # registry PUT via OIDC, so the publish would fail with a 404.
      # Pinned to 11.18.0 (NOT @latest): npm 12.0.0 regressed --provenance with
      # "Cannot find module 'sigstore'", which silently broke publishing from the
      # 1.11.0 release onward. Bump deliberately after verifying provenance works.
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile
      # A `catalog:` reference is replaced by its range at pack time, so this is
      # the last moment a wrong range is still recallable. The frozen install
      # above does not catch every shape on its own — a peer range shadowed by a
      # dev dependency of the same name never reaches the lockfile — and this job
      # is reachable without CI having run on the same commit.
      - run: node scripts/check-catalog.mjs
      # Decide whether anything needs publishing BEFORE building, so the common
      # case (a release-please run that only refreshes the release PR, no version
      # change) exits cheaply without a full build.
      - id: check
        run: |
          need=0
          for p in types nql core adapter-pgsql cli; do
            name=$(jq -r .name "packages/$p/package.json")
            ver=$(jq -r .version "packages/$p/package.json")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already on npm"
            else
              echo "$name@$ver needs publishing"
              need=1
            fi
          done
          echo "need=$need" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.need == '1'
        name: Build packages
        run: |
          pnpm -C packages/types build
          pnpm -C packages/nql build
          pnpm -C packages/core build
          pnpm -C packages/adapter-pgsql build
          pnpm -C packages/cli build
      # Publish via `pnpm pack` + `npm publish <tarball>`:
      #   - pnpm pack resolves workspace:/catalog: protocols into real versions
      #     inside the tarball's package.json (the marker-leak that broke 1.0.0
      #     when published with plain npm), so the tarball is self-contained.
      #   - npm publish then uploads that finished tarball with --provenance via
      #     OIDC trusted publishing (no NPM_TOKEN). npm validates provenance
      #     against the trusted-publisher config for each @dbsp/* package.
      # Why not `pnpm publish --provenance`: pnpm forwards --no-git-checks to the
      # npm process it delegates provenance to, and npm rejects it (EUSAGE).
      #
      # Idempotent: skip any package already on npm. release-please bumps only
      # changed packages (types may stay put while core/cli advance). Publishing
      # in dependency order, guarded by an existence check, makes partial
      # releases and re-runs safe — never failing on "cannot publish over
      # previously published version".
      - if: steps.check.outputs.need == '1'
        name: Publish changed packages
        run: |
          for p in types nql core adapter-pgsql cli; do
            name=$(jq -r .name "packages/$p/package.json")
            ver=$(jq -r .version "packages/$p/package.json")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already on npm — skipping"
            else
              echo "Publishing $name@$ver"
              tgz=$(cd "packages/$p" && pnpm pack | tail -1)
              npm publish "packages/$p/$tgz" --provenance --access public
            fi
          done
      # @dbsp/mcp-server publish skipped — scaffold only (no MCP tools yet,
      # see issue 112). Re-enable once the first tool ships.
